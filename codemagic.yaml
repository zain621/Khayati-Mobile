workflows:
  ios-testflight:
    name: Khayati Mobile TestFlight Build
    max_build_duration: 90

    integrations:
      app_store_connect: KhayatiAppStoreKey

    environment:
      groups:
        - env_vars
      flutter: 3.35.5
      xcode: "26.5"
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.os.khayati.app

    scripts:
      - name: Create .env file
        script: |
          printf '%s\n' "$ENV_FILE" > .env

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate model files
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Configure code signing
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - adminkhayati@gmail.com
        notify:
          success: true
          failure: true
