workflows:
  ios-testflight:
    name: Khayati Mobile TestFlight Build
    max_build_duration: 90

    integrations:
      app_store_connect: KhayatiAppStoreKey

    environment:
      groups:
        - env_vars
      flutter: 3.35.5
      xcode: "26.5"
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.os.khayati.app

    scripts:
      - name: Create .env file
        script: |
          if [ -z "${ENV_FILE:-}" ]; then
            echo "ERROR: ENV_FILE secure variable is empty. Add it to the env_vars group."
            exit 1
          fi
          # Strip CR so Windows-edited secrets don't break keys (apiUrl\r).
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          if ! grep -q '^apiUrl=' .env; then
            echo "ERROR: .env is missing apiUrl= (check ENV_FILE content)."
            exit 1
          fi
          # Print keys only — never values — so CI logs stay safe.
          echo "Loaded .env keys:"
          cut -d= -f1 .env | sed '/^$/d;/^\s*#/d'

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate model files
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Configure code signing
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "6827130588" || echo 0)
          BUILD_NUMBER=$((LATEST + 1))
          echo "Using build number $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - adminkhayati@gmail.com
        notify:
          success: true
          failure: true
